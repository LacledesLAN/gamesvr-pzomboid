name: linux/amd64

on:
  schedule:
    - cron: '0 7 * * THU'
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install --yes tmux
      - name: Build Linux Image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./linux.Dockerfile
          tags: |
            gamesvr-pzomboid:latest
            lacledeslan/gamesvr-pzomboid:latest
            ghcr.io/lacledeslan/gamesvr-pzomboid:latest
          build-args: |
            BUILDNODE=GitHub (Run Number: ${{ github.run_number }} Run ID: ${{ github.run_id }})
            SOURCE_COMMIT=${{ github.sha }}
          pull: true
          no-cache: true
      - name: Test Linux Image
        run: ./tests/gamesvr-pzomboid.sh gamesvr-pzomboid /app/start-server.sh -adminpassword tk421 -steamvac false;
      - name: Login to DockerHub
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Push to Docker HUB
        if: ${{ github.event_name != 'pull_request' }}
        run: docker push lacledeslan/gamesvr-pzomboid:latest
      - name: Push to GitHub Packages
        if: ${{ github.event_name != 'pull_request' }}
        run: docker push ghcr.io/lacledeslan/gamesvr-pzomboid:latest
